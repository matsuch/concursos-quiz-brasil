<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="Q8gF4sVkTgODgTx2f0MXYhkxVC9kLRBA6K0yieHjdAA" />
    
    <!-- Título e Descrição -->
    <title>Passar Concursos — concursos abertos, questões e guias de estudo gratuitos</title>
    <meta name="description" content="Plataforma gratuita para quem estuda para concursos públicos: lista de concursos com inscrições abertas, questões por matéria, flashcards, planner de estudos e guias práticos." />
    <meta name="author" content="Passar Concursos" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Sem canonical fixa aqui: este HTML e servido para TODA rota, entao
         declarar "/" faria /concursos e /quiz se anunciarem como copia da
         home para quem nao executa JavaScript. Cada pagina poe a sua pelo
         Helmet. As og:* abaixo ficam como padrao da home; corrigi-las por
         rota depende de pre-renderizacao. -->
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://passar-concursos.vercel.app/" />
    <meta property="og:site_name" content="Passar Concursos" />
    <meta property="og:title" content="Passar Concursos — concursos abertos, questões e guias de estudo gratuitos" />
    <meta property="og:description" content="Concursos com inscrições abertas, questões por matéria, flashcards, planner de estudos e guias práticos. Gratuito e sem anúncios." />
    <meta property="og:image" content="https://passar-concursos.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://passar-concursos.vercel.app/" />
    <meta name="twitter:title" content="Passar Concursos — concursos abertos, questões e guias gratuitos" />
    <meta name="twitter:description" content="Concursos com inscrições abertas, questões por matéria, flashcards, planner de estudos e guias práticos. Gratuito e sem anúncios." />
    <meta name="twitter:image" content="https://passar-concursos.vercel.app/twitter-image.jpg" />
    
    <!-- Fonte do site (ver src/index.css): pré-carregada para o texto não trocar de face depois de pintado. -->
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2342a9" />
    <meta name="msapplication-TileColor" content="#2342a9" />
    
    <!-- Schema.org JSON-LD -->
    <!--
      Só afirmação verificável aqui. Saíram:
        sameAs  — apontava para perfis em Facebook, Instagram e Twitter que não
                  existem. Dado estruturado falso é dos poucos sinais que dá
                  para errar para pior: o buscador checa e passa a desconfiar
                  do resto.
        offers  — "availability: InStock" não quer dizer nada para um serviço,
                  e hoje a plataforma é gratuita.
      Para voltar com sameAs, use só perfis que existam de verdade.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Passar Concursos",
      "description": "Plataforma gratuita de preparação para concursos públicos: questões, flashcards, planner de estudos, guias e listagem de concursos abertos no Brasil.",
      "url": "https://passar-concursos.vercel.app",
      "logo": "https://passar-concursos.vercel.app/logo.png",
      "inLanguage": "pt-BR",
      "areaServed": {
        "@type": "Country",
        "name": "Brasil"
      },
      "isAccessibleForFree": true
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
