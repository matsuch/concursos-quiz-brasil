    <!-- Schema.org JSON-LD -->
    <!--
      Só afirmação verificável aqui. Saíram:
        sameAs  — apontava para perfis em Facebook, Instagram e Twitter que não
                  existem. Dado estruturado falso é dos poucos sinais que dá
                  para errar para pior: o buscador checa e passa a desconfiar
                  do resto.
        offers  — "availability: InStock" não quer dizer nada para um serviço,
                  e hoje a plataforma é gratuita.
      Para voltar com sameAs, use só perfis que existam de verdade.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Passar Concursos",
      "description": "Plataforma gratuita de preparação para concursos públicos: questões, flashcards, simulados, planner de estudos e listagem de concursos abertos no Brasil.",

      "inLanguage": "pt-BR",
      "areaServed": {
        "@type": "Country",
        "name": "Brasil"
      },
      "isAccessibleForFree": true
    }
    </script>
