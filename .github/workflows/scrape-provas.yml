name: Coleta de provas oficiais

# Baixa provas e gabaritos oficiais (scripts/scrape/provas/fontes.json) e
# commita o texto extraído em scratch/provas/. Fica separado do scrape.yml para
# não mexer no job.json, que comanda a coleta semanal de concursos.
#
# Como disparar: editar scripts/scrape/provas/fontes.json (ou o script) e dar
# push. O commit de resposta usa o GITHUB_TOKEN, que não dispara workflows.

on:
  push:
    paths:
      - 'scripts/scrape/provas.py'
      - 'scripts/scrape/provas/**'
      - '.github/workflows/scrape-provas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Baixar e extrair
        run: python scripts/scrape/provas.py

      - name: Commitar resultado
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A scratch/provas
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Texto das provas oficiais (coleta automática)"
          for tentativa in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((tentativa * 4))
          done
          echo "::error::Não foi possível empurrar o resultado."
          exit 1
